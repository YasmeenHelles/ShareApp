<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شير | تسجيل الدخول</title>
<style>
:root{--navy:#101d3a;--muted:#8390ad;--yellow:#ffc94d;--bg:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--navy);min-height:100vh;display:grid;place-items:center;overflow-x:hidden}.blob{position:fixed;background:#fff0be;opacity:.65;border-radius:50%;z-index:-1}.b1{width:260px;height:260px;top:-90px;left:-110px}.b2{width:280px;height:330px;right:-180px;top:35%}.b3{width:220px;height:260px;left:-120px;bottom:-90px}.phone{width:min(100%,440px);min-height:100vh;padding:36px 28px 30px;display:flex;flex-direction:column;justify-content:center}.brand{text-align:center;margin-bottom:36px}.plane{font-size:42px;color:#f3b92f;line-height:1}.logo{font-size:64px;font-weight:900;line-height:1.1;margin:0 0 22px}.headline{font-size:21px;font-weight:bold;margin:0 0 10px}.subtitle{font-size:16px;color:var(--muted);margin:0}.field{height:70px;border:0;border-radius:22px;background:white;box-shadow:0 5px 20px #c8bfa817;display:flex;align-items:center;gap:13px;padding:0 18px;margin:0 0 17px}.field input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:17px;color:var(--navy);background:transparent;text-align:right}.field input::placeholder{color:var(--muted)}.icon{font-size:25px;color:var(--muted);cursor:pointer}.forgot{border:0;background:none;color:var(--muted);font:inherit;display:block;margin:-2px 0 25px auto;cursor:pointer}.login{height:76px;width:100%;border:0;border-radius:24px;background:var(--yellow);font:inherit;font-size:22px;font-weight:bold;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:18px}.login:hover{background:#ffd56e}.message{text-align:center;font-size:13px;line-height:1.6;margin:10px 0 0}.divider{display:flex;align-items:center;gap:14px;margin:40px 0 25px;color:var(--muted);font-size:20px}.divider:before,.divider:after{content:"";height:1px;background:#e6e3dc;flex:1}.socials{display:flex;justify-content:center;gap:12px}.social{width:75px;height:78px;border:0;border-radius:21px;background:#fff;box-shadow:0 5px 20px #c8bfa817;font-size:28px;cursor:pointer}.google{color:#4285f4}.facebook{color:#1877f2}.signup{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:48px;color:var(--muted);font-size:16px}.signup button{border:0;background:none;color:#f3b92f;font:inherit;font-weight:bold;cursor:pointer}@media(min-width:600px){.phone{min-height:0;margin:28px auto;width:430px;padding:42px 28px;background:#fffefa;border-radius:36px;box-shadow:0 18px 70px #b9aa8240}.brand{margin-bottom:34px}}@media(max-height:760px){.phone{padding-top:24px;padding-bottom:24px}.brand{margin-bottom:24px}.logo{font-size:54px}.divider{margin:26px 0 20px}.signup{margin-top:32px}}
</style>
</head>
<body><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main class="phone">
<header class="brand"><div class="plane">➤</div><h1 class="logo">شير</h1><p class="headline">ارفع محتواك .. وانشره في كل مكان</p><p class="subtitle">صور، فيديوهات .. إلى جميع منصاتك بسهولة</p></header>
<form id="loginForm">
<label class="field"><span class="icon">✉</span><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" aria-label="البريد الإلكتروني" required></label>
<label class="field"><span class="icon" id="togglePassword" role="button" tabindex="0" aria-label="إظهار كلمة المرور">◉</span><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" aria-label="كلمة المرور" required><span class="icon">♙</span></label>
<button class="forgot" type="button" data-action="استعادة كلمة المرور">نسيت كلمة المرور؟</button>
<button class="login" type="submit">تسجيل الدخول <span style="font-size:30px">←</span></button><p class="message" id="message" aria-live="polite"></p>
</form>
<div class="divider">أو</div>
<div class="socials"><button class="social google" data-action="تسجيل Google" aria-label="Google">G</button><button class="social" data-action="تسجيل Apple" aria-label="Apple">●</button><button class="social facebook" data-action="تسجيل Facebook" aria-label="Facebook">f</button><button class="social" data-action="تسجيل X" aria-label="X">𝕏</button></div>
<div class="signup"><span>ليس لديك حساب؟</span><button data-action="إنشاء حساب جديد">إنشاء حساب جديد</button></div>
</main>
<script>
const msg=document.getElementById('message');document.getElementById('togglePassword').addEventListener('click',toggle);document.getElementById('togglePassword').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});function toggle(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('togglePassword').setAttribute('aria-label',p.type==='password'?'إظهار كلمة المرور':'إخفاء كلمة المرور')}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();msg.textContent='تم التحقق من الحقول. اربط النموذج بخدمة تسجيل الدخول الخاصة بك.'});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>msg.textContent=b.dataset.action+' — هذه الواجهة تجريبية، أضف الخدمة المناسبة لاحقًا.'));
</script></body></html>
